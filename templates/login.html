{% extends "base.html" %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    
    <div class="col-md-6 col-lg-5 col-xl-4">
      
      <!-- Login Card -->
      <div class="card glass shadow-lg border-0 fade-in-up">
        <div class="card-body p-4 p-md-5">
          
          <!-- Header -->
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3 shadow-sm" style="width: 80px; height: 80px;">
              <i class="bi bi-shield-lock-fill fs-1"></i>
            </div>
            <h2 class="fw-bold text-dark mb-1">Welcome Back</h2>
            <p class="text-muted small">
              {% if role %}
                Login to your {{ role|capitalize }} account
              {% else %}
                Please login to continue
              {% endif %}
            </p>
          </div>

          <!-- Form -->
          <form method="post" class="needs-validation" novalidate
                onsubmit="this.querySelector('button').disabled=true; this.querySelector('.btn-text').innerText='Logging in...'; this.querySelector('.spinner-border').classList.remove('d-none');">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
              <label for="username">Username</label>
            </div>

            <div class="form-floating mb-4">
              <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
              <label for="password">Password</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 mb-3 fw-bold d-flex align-items-center justify-content-center gap-2">
              <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
              <span class="btn-text">Sign In</span>
              <i class="bi bi-arrow-right"></i>
            </button>

            {% if role %}
            <div class="text-center">
              <span class="text-muted small">Don't have an account?</span>
              <a href="{{ url_for('auth.register', role=role) }}" class="text-decoration-none fw-semibold ms-1">Create Account</a>
            </div>
            {% endif %}

          </form>
        </div>
      </div>
      
      <!-- Footer Help -->
      <div class="text-center mt-4 text-muted small fade-in-up" style="animation-delay: 0.1s;">
        <i class="bi bi-shield-check me-1"></i> Secure Connection
      </div>

    </div>
  </div>
</div>
{% endblock %}
