{% extends "base.html" %}
{% block content %}

<!-- ================= PAGE HEADER ================= -->
<div class="mb-4 fade-in-up">
  <div class="d-flex align-items-center">
    <div class="bg-primary-subtle text-primary rounded-circle p-3 me-3">
      <i class="bi bi-megaphone-fill fs-4"></i>
    </div>
    <div>
      <h3 class="fw-bold text-primary mb-1">Broadcast Message</h3>
      <p class="text-muted mb-0">
        Send health announcements or updates to patients in your area
      </p>
    </div>
  </div>
</div>

<!-- ================= BROADCAST FORM ================= -->
<div class="row justify-content-center fade-in-up" style="animation-delay: 0.1s;">
  <div class="col-lg-7">

    <div class="card glass border-0 overflow-hidden">
      <div class="card-header bg-gradient-primary text-white p-3 border-0">
        <h5 class="mb-0 fw-bold text-center">
          <i class="bi bi-send-fill me-2"></i> New Announcement
        </h5>
      </div>
      <div class="card-body p-4 bg-white bg-opacity-50">

        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <!-- Patient Selection -->
          <div class="mb-4">
            <label class="form-label text-muted small fw-bold text-uppercase d-flex justify-content-between">
              <span>Select Recipients</span>
              <span class="text-primary fw-normal small">
                <i class="bi bi-info-circle me-1"></i> Leave empty to send to all
              </span>
            </label>

            <div class="border rounded-3 p-3 bg-white shadow-inner" style="max-height: 250px; overflow-y: auto;">
              {% if patients %}
                <div class="row g-2">
                  {% for p in patients %}
                  <div class="col-md-6">
                    <div class="form-check p-2 rounded hover-bg-light transition-base">
                      <input class="form-check-input"
                             type="checkbox"
                             name="patients"
                             value="{{ p.id }}"
                             id="p{{ p.id }}">
                      <label class="form-check-label w-100 cursor-pointer" for="p{{ p.id }}">
                        <div class="d-flex align-items-center">
                          <div class="avatar-xs bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 24px; height: 24px; font-size: 0.8rem;">
                            {{ p.username[:1] }}
                          </div>
                          {{ p.username }}
                        </div>
                      </label>
                    </div>
                  </div>
                  {% endfor %}
                </div>
              {% else %}
                <div class="text-center text-muted py-4">
                  <i class="bi bi-people display-6 opacity-25"></i>
                  <p class="mb-0 mt-2 small">No patients found in your area.</p>
                </div>
              {% endif %}
            </div>
          </div>

          <!-- Message -->
          <div class="mb-4">
            <label class="form-label text-muted small fw-bold text-uppercase">Message Content</label>
            <textarea class="form-control border-0 shadow-sm"
                      name="message"
                      rows="5"
                      placeholder="Type your announcement or health message here..."
                      style="resize: none;"
                      required></textarea>
          </div>

          <!-- Submit -->
          <button class="btn btn-primary w-100 py-3 shadow-sm fw-bold">
            <i class="bi bi-send-fill me-2"></i>
            Send Broadcast
          </button>

        </form>

      </div>
    </div>

  </div>
</div>

{% endblock %}
